# =============================================================================
#  webserv — feature showcase
# =============================================================================
#
#  Every directive the parser understands appears at least once below, in every
#  context it is legal in.  Run it with:
#
#      make prepare-confs && ./webserv conf/generated/showcase.conf
#
#  (`root` only accepts an absolute path token, so `__WWWROOT__` has to be
#   substituted by `make prepare-confs` first — the raw file cannot be run.)
#
#  Sockets:
#      127.0.0.1:8080   main demo site       (default_server)
#      127.0.0.1:8080   Host: static.local   (name-based virtual host)
#      127.0.0.1:8081   second port          (backlog=, own document root)
#
#  A guided tour with copy-pasteable curl commands is at the bottom of the file.
#  Lines marked "[BUG]" are directives that parse but misbehave at runtime —
#  they are kept here on purpose so the gap is visible during a demo.
# =============================================================================

http {
	# --- Global document root, inherited by every server/location below -----
	root __WWWROOT__;

	# --- Request limits & timeouts (http context) ---------------------------
	# Inherited downward; servers and locations override them selectively.
	client_header_buffer_size	4k;		# 4000 bytes for the request line + headers
	large_client_header_buffers	8 16k;	# fallback pool for oversized headers
	client_header_timeout		30s;	# -> 408 if the header is not complete in time
	client_body_buffer_size		8k;
	client_body_timeout			30s;
	client_max_body_size		2m;		# 2000000 bytes; tightened per-location below

	# --- MIME map (block directive) -----------------------------------------
	# Declaring `types` REPLACES the inherited map (default: html/gif/jpeg).
	types {
		text/html		html htm;
		text/css		css;
		text/plain		txt;
		application/javascript	js;
		image/png		png;
		image/jpeg		jpeg jpg;
		image/gif		gif;
		image/x-icon	ico;
		application/pdf	pdf;
		application/json	json;
	}
	default_type	text/plain;			# used for extensions not in the map

	# --- Directory handling default -----------------------------------------
	index	index.html;					# cleared by `autoindex true` per-location

	# --- Error pages inherited by every server ------------------------------
	error_page	404	/404.html;
	error_page	500 501 502 503 504	/50x.html;

	# =========================================================================
	#  SERVER 1 — the main demo site.  default_server for 127.0.0.1:8080.
	# =========================================================================
	server {
		listen		127.0.0.1:8080 default_server;
		server_name	localhost showcase.local;	# several names accumulate

		root __WWWROOT__;

		# Server-level overrides of the inherited limits.
		client_header_timeout	20s;
		client_body_timeout		20s;
		client_max_body_size	1m;

		# NB: the FIRST error_page in a block CLEARS the inherited map, so every
		# code this server cares about has to be (re)listed together here.
		error_page	404	/404.html;
		error_page	500 501 502 503 504	/50x.html;
		# `=<code>` overrides the status actually sent: 405 serves the body of
		# 405.html but answers 200.  (Needs www/errors/405.html — see report.)
		#error_page	405	=200	/errors/405.html;
		# A bare `=` keeps the status the internal redirect produced.
		#error_page	403	=		/errors/403.html;
		# An absolute URL turns the error into an EXTERNAL redirect.
		#error_page	413	=302	https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/413;

		# ------------------------------------------------------------------
		#  Catch-all.  Longest-prefix wins, so every location below beats it.
		# ------------------------------------------------------------------
		location / {
			root __WWWROOT__;
			# `index` (inherited from http) turns GET / into GET /index.html
		}

		# ------------------------------------------------------------------
		#  Prefix match + a NESTED location.
		#  A nested block's path is parent-path + own-path, i.e. `/static/css`,
		#  and it inherits everything the parent resolved to.
		# ------------------------------------------------------------------
		location /static {
			root __WWWROOT__;
			index index.html;

			location /css {
				root __WWWROOT__;
				# Location-scoped MIME map: replaces the inherited one for this
				# subtree only.
				types {
					text/css	css;
				}
				default_type	text/plain;
			}
		}

		# ------------------------------------------------------------------
		#  Generated directory listing.  `autoindex true` clears the inherited
		#  `index`, so the directory is listed instead of serving index.html.
		#  (The parser takes true/false — not nginx's on/off.)
		# ------------------------------------------------------------------
		location /autoindex {
			root __WWWROOT__;
			autoindex true;
		}

		# ------------------------------------------------------------------
		#  Per-location index file for a subdirectory.
		# ------------------------------------------------------------------
		location /idxdir {
			root __WWWROOT__;
			index index.html;
		}

		# ------------------------------------------------------------------
		#  A directory whose index is not an .html file (42 tester fixture).
		# ------------------------------------------------------------------
		location /YoupiBanane {
			root __WWWROOT__;
			index youpi.bad_extension;
		}

		# The tester asks for /directory/ specifically.  There is no `alias`
		# directive, so `root` is still prefixed to the whole URI: this resolves
		# to <root>/YoupiBanane/directory/ and needs that directory to exist.
		location /directory/ {
			root __WWWROOT__/YoupiBanane;
			index youpi.bad_extension;
		}

		# ------------------------------------------------------------------
		#  Method restriction: only GET survives here, everything else -> 405.
		# ------------------------------------------------------------------
		location /readonly {
			root __WWWROOT__;
			limit_except GET;
		}

		# ------------------------------------------------------------------
		#  Upload / delete playground.
		#  POST writes its body to <root><uri> and answers 201; DELETE unlinks
		#  that file and answers 204.
		# ------------------------------------------------------------------
		location /uploads {
			root __WWWROOT__;
			limit_except GET POST DELETE;
			client_body_buffer_size	16k;
			client_max_body_size	1m;		# -> 413 above 1000000 bytes
			autoindex true;					# browse what has been uploaded
		}

		# ------------------------------------------------------------------
		#  Tighter per-location body cap: anything over 100 bytes -> 413.
		#  Needs the directory www/tiny/ to exist (see report).
		# ------------------------------------------------------------------
		location /tiny {
			root __WWWROOT__;
			client_max_body_size 100;
		}

		# ------------------------------------------------------------------
		#  Redirects.
		# ------------------------------------------------------------------
		# [BUG] internal `return` loops: handle_setup rewrites _req.path but
		# never re-resolves _loc, so this location's `return` fires again every
		# iteration until REDIRECT_LIMIT and the client gets 500.
		location /old {
			return 301 /index.html;
		}

		# External redirect (absolute URL) — this one works.
		location /ext {
			return 302 https://example.com/;
		}

		# `return` with no explicit status code.  [BUG] same loop as /old.
		location /gone {
			return /index.html;
		}

		# ------------------------------------------------------------------
		#  CGI by prefix.  cgi_param adds environment variables on top of the
		#  standard RFC 3875 set.
		# ------------------------------------------------------------------
		location /cgi-bin {
			root __WWWROOT__;
			cgi_pass /usr/bin/python3;

			cgi_param APP_ENV		showcase;
			cgi_param SECRET_KEY	hunter2;
			# NB: a cgi_param value must lex as a bare string.  A value starting
			# with '/' lexes as a path token and is rejected, so filesystem
			# paths cannot be handed to a script this way today.

			client_max_body_size 1m;
		}

		# ------------------------------------------------------------------
		#  CGI by SUFFIX.  A leading `\` switches prefix matching off, so this
		#  block matches any URI ENDING in `.bla`, in any directory.
		# ------------------------------------------------------------------
		location \ .bla {
			root __WWWROOT__;
			cgi_pass __WWWROOT__/cgi-bin/cgi_test;
		}
	}

	# =========================================================================
	#  SERVER 2 — name-based virtual host sharing 127.0.0.1:8080.
	#  Selected only when the Host header is `static.local`/`assets.local`;
	#  anything else on this socket falls through to SERVER 1.
	# =========================================================================
	server {
		listen		127.0.0.1:8080;
		server_name	static.local assets.local;

		root __WWWROOT__/static;

		index index.html;

		error_page	404	/404.html;

		location / {
			root __WWWROOT__/static;
		}

		# This vhost is read-only and browsable.
		location /css {
			root __WWWROOT__/static;
			limit_except GET;
			autoindex true;
		}

		location /img {
			root __WWWROOT__/static;
			limit_except GET;
			autoindex true;
		}
	}

	# =========================================================================
	#  SERVER 3 — a second port with its own document root and backlog.
	#  Demonstrates one process serving several sockets from one config.
	# =========================================================================
	server {
		listen		127.0.0.1:8081 default_server backlog=64;
		server_name	parapara.local localhost;

		root __WWWROOT__/parapara;

		# Everything not mentioned here is inherited from the http block.
		client_max_body_size 512k;

		error_page	404	/index.html;	# every miss lands back on the front page

		location / {
			root __WWWROOT__/parapara;
			limit_except GET;
		}

		location /css {
			root __WWWROOT__/parapara;
			limit_except GET;
			autoindex true;
		}
	}
}

# =============================================================================
#  GUIDED TOUR  (all commands verified against this config)
# =============================================================================
#
#  static files + MIME map
#    curl -i http://127.0.0.1:8080/                       200 text/html (index)
#    curl -i http://127.0.0.1:8080/static/                200 text/html
#    curl -i http://127.0.0.1:8080/static/css/style.css   200 text/css
#    curl -i http://127.0.0.1:8080/static/image.png       200 image/png
#    curl -i http://127.0.0.1:8080/big.txt                200 text/plain
#
#  directory handling
#    curl -i http://127.0.0.1:8080/autoindex/     200 generated listing
#    curl -i http://127.0.0.1:8080/idxdir/        200 www/idxdir/index.html
#    curl -i http://127.0.0.1:8080/YoupiBanane/   200 youpi.bad_extension
#
#  errors
#    curl -i http://127.0.0.1:8080/nope           404 + www/404.html
#    curl -i -X FROB http://127.0.0.1:8080/       501 + www/50x.html
#
#  methods
#    curl -i -X DELETE http://127.0.0.1:8080/readonly/dontdelete   405, Allow: GET
#    curl -i -X POST --data 'hello upload' http://127.0.0.1:8080/uploads/demo.txt
#                                                                  201 Created
#    curl -i http://127.0.0.1:8080/uploads/                        200 listing
#    curl -i -X DELETE http://127.0.0.1:8080/uploads/demo.txt      204 No Content
#
#  body limit
#    head -c 1200000 /dev/zero | tr '\0' a > /tmp/big.bin
#    curl -i -X POST --data-binary @/tmp/big.bin \
#         http://127.0.0.1:8080/uploads/toobig.txt                 413
#
#  header timeout (408) — open a connection and never finish the header
#    printf 'GET / HTTP/1.1\r\n' | nc 127.0.0.1 8080     ... 408 after 20s
#
#  redirects
#    curl -i http://127.0.0.1:8080/ext            302 Location: https://example.com/
#    curl -i http://127.0.0.1:8080/old            [BUG] 500 instead of 301
#
#  CGI
#    curl -i 'http://127.0.0.1:8080/cgi-bin/echo.py?a=1&b=2'   METHOD/QUERY/BODY
#    curl -i -X POST --data hello http://127.0.0.1:8080/cgi-bin/echo.py
#    curl -i http://127.0.0.1:8080/cgi-bin/env.py             CONTENT_LENGTH/TYPE
#    curl -i http://127.0.0.1:8080/YoupiBanane/youpi.bla      suffix-matched CGI
#
#  virtual hosts (same socket, different Host)
#    curl -i -H 'Host: localhost'    http://127.0.0.1:8080/   main site
#    curl -i -H 'Host: static.local' http://127.0.0.1:8080/   www/static/index.html
#    curl -i -H 'Host: static.local' http://127.0.0.1:8080/css/   listing
#
#  second port
#    curl -i http://127.0.0.1:8081/               www/parapara/index.html
#    curl -i http://127.0.0.1:8081/css/           listing
# =============================================================================

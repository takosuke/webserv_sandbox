http {
	types {
		text/html	html;
	}
	default_type	text/plain;

	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		# Deliberately large: this config exists to test that a POST body is
		# written to disk *in full*, not that the size limit works (that is
		# body_size_limit.conf). The probe body is a few KB, i.e. several times
		# the default 1024-byte client_header_buffer_size, so the body cannot
		# arrive in the single buffer that handle_setup leaves behind.
		client_max_body_size 1m;

		error_page 404 /404.html;
		error_page 500 501 502 503 504 /50x.html;

		location / {
			root __WWWROOT__;
		}
	}
}

http {
	types {
		text/html	html;
		image/gif	gif;
		image/jpeg	jpeg;
	}
	default_type	text/plain;

	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		client_max_body_size 10k;

		error_page 404 /404.html;
		error_page 500 501 502 503 504 /50x.html;

		location /cgi-bin {
			root __WWWROOT__;
			cgi_pass /usr/bin/python3;
		}

		location / {
			root __WWWROOT__;
		}
	}
}

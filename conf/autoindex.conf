http {
	types {
		text/html	html;
	}
	default_type	text/plain;

	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		# NB: this server's parser takes true/false, not nginx's on/off.
		# No `index` directive here on purpose: a request for a directory must
		# fall through to the generated listing.
		autoindex true;

		error_page 404 /404.html;
		error_page 500 501 502 503 504 /50x.html;

		location / {
			root __WWWROOT__;
		}
	}
}

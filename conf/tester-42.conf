http {
	upload_directory __WWWROOT__/upload upload;
	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		error_page 400 /errorpages/400.html;
		error_page 401 /errorpages/401.html;
		error_page 403 /errorpages/403.html;
		error_page 404 /errorpages/404.html;
		error_page 405 /errorpages/405.html;
		error_page 408 /errorpages/408.html;
		error_page 413 /errorpages/413.html;
		error_page 500 501 502 503 504 /errorpages/50x.html;

		location \ .jpg {
			root __WWWROOT__/imgs;
		}

		location \ .css {
			root __WWWROOT__/css;
			default_type	text/css;
		}

		# Any file ending in .bla is handled by the cgi_test executable.
		location \ .bla {
			root __WWWROOT__;
			cgi_pass __WWWROOT__/cgi-bin/cgi_test;
		}

		location /post_body {
			root __WWWROOT__;
			client_max_body_size 100;
		}

		# Served from the YoupiBanane fixture repo. When a directory itself is
		# requested (no file named), youpi.bad_extension is used as the index.
		location /directory/ {
			root __WWWROOT__/YoupiBanane;
			index youpi.bad_extension;
		}

		# Only GET is allowed at the root.
		location / {
			root __WWWROOT__;
			limit_except GET;
		}
	}
}

# Pins that config::header is inherited Server -> Location (issue 8).
#
# handle_setup() ends with `_timeout = _loc->get_header().timeout`. Before the
# fix, Location::from_server did not copy `header`, so every request reaching
# that line silently reverted to the 60 s default no matter what was configured.
#
# A *static* POST cannot show this: it returns from handle_setup before line 678.
# A POST to a cgi_pass location does reach it, so that is what this conf targets.
http {
	types { text/html html; }
	default_type text/plain;

	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		client_max_body_size 1m;
		client_header_timeout 2;
		client_body_timeout   2;

		location /cgi-bin {
			root __WWWROOT__;
			cgi_pass /usr/bin/python3;
		}

		location / {
			root __WWWROOT__;
		}
	}
}

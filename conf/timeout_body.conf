http {
	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		client_max_body_size 1m;

		# Short on purpose: a stalled client must be dealt with in seconds, in
		# both phases. The header phase honours this today; the body phase does
		# not, because handle_setup() overwrites _timeout with the *location's*
		# header.timeout and config::header is never inherited into a Location.
		client_header_timeout	2;
		client_body_timeout		2;

		error_page 404 /404.html;
		error_page 500 501 502 503 504 /50x.html;

		location / {
			root __WWWROOT__;
		}
	}
}

# Mirrors base.conf's CGI setup but with a header buffer large enough to hold
# big_header.py's ~3 KB X-Big value. Pairs with cgi_robustness_test's
# over-buffer probe (which runs on base.conf's 1024-byte default) so both
# sides of the configurable limit are pinned.
http {
	types {
		text/html	html;
	}
	default_type	text/plain;

	server {
		listen 127.0.0.1:8080 default_server;
		server_name localhost;

		root __WWWROOT__;

		client_header_buffer_size 8192;

		location /cgi-bin {
			root __WWWROOT__;
			cgi_pass /usr/bin/python3;
		}

		location / {
			root __WWWROOT__;
		}
	}
}

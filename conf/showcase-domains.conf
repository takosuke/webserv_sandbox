# =============================================================================
#  webserv — feature showcase, domain-name edition
# =============================================================================
#
#  Same feature tour as conf/showcase.conf, but the sites are addressed by real
#  domain names on the default HTTP port instead of `localhost:8080`, and each
#  apex domain 301-redirects to its `www.` subdomain the way an nginx
#  deployment normally does.
#
#      pizzasuicideclub.com  ->  www.pizzasuicideclub.com   (main demo site)
#      duomingo.es           ->  www.duomingo.es            (static asset site)
#      parapara.pizzasuicideclub.com                        (subdomain)
#
#  ---------------------------------------------------------------------------
#  SETUP
#
#  1. The names have to resolve to the loopback address:
#
#         sudo tee -a /etc/hosts <<'EOF'
#         127.0.0.1  pizzasuicideclub.com www.pizzasuicideclub.com
#         127.0.0.1  duomingo.es www.duomingo.es
#         127.0.0.1  parapara.pizzasuicideclub.com
#         EOF
#
#  2. Port 80 is privileged — below net.ipv4.ip_unprivileged_port_start (1024
#     by default), so an ordinary user cannot bind it and webserv exits with
#     "Permission denied".  Grant the binary the one capability it needs:
#
#         sudo setcap 'cap_net_bind_service=+ep' ./webserv
#
#     This survives until the binary is replaced, so re-run it after `make re`.
#     `sudo ./webserv ...` works too, but then every uploaded file under
#     www/uploads/ ends up owned by root.
#
#  3. Substitute the document root and run:
#
#         make prepare-confs && ./webserv conf/generated/showcase-domains.conf
#
#     (`root` only accepts an absolute path token, so `__WWWROOT__` has to be
#      substituted by `make prepare-confs` first — the raw file cannot be run.)
#
#  ---------------------------------------------------------------------------
#  Sockets:
#      127.0.0.1:80     www.pizzasuicideclub.com   main demo site (default_server)
#      127.0.0.1:80     www.duomingo.es            name-based virtual host
#      127.0.0.1:80     pizzasuicideclub.com       301 -> www  (redirect-only)
#      127.0.0.1:80     duomingo.es                301 -> www  (redirect-only)
#      127.0.0.1:80     parapara.pizzasuicideclub.com
#      127.0.0.1:8081   the same parapara host on a second socket (backlog=)
#
#  Everything the domains serve is on :80.  The extra 8081 socket exists only
#  to keep the showcase's "one process, several listening sockets" and
#  `backlog=` demo alive — reach it at http://127.0.0.1:8081/.
#
#  The Host header is matched with its port stripped, so `Host: duomingo.es:80`
#  still selects `server_name duomingo.es`.  Names are matched EXACTLY — there
#  is no `*.example.com` wildcard support — so every hostname that should be
#  served has to be spelled out below.
#
#  A guided tour with copy-pasteable curl commands is at the bottom of the file.
#  Lines marked "[BUG]" are directives that parse but misbehave at runtime —
#  they are kept here on purpose so the gap is visible during a demo.
# =============================================================================

http {
	# --- Global document root, inherited by every server/location below -----
	root __WWWROOT__;

	# --- Request limits & timeouts (http context) ---------------------------
	# Inherited downward; servers and locations override them selectively.
	client_header_buffer_size	4k;		# 4000 bytes for the request line + headers
	client_header_timeout		30s;	# -> 408 if the header is not complete in time
	client_body_buffer_size		8k;
	client_body_timeout			30s;
	client_max_body_size		2m;		# 2000000 bytes; tightened per-location below

	# --- MIME map (block directive) -----------------------------------------
	# Declaring `types` REPLACES the inherited map (default: html/gif/jpeg).
	types {
		text/html		html htm;
		text/css		css;
		text/plain		txt;
		application/javascript	js;
		image/png		png;
		image/jpeg		jpeg jpg;
		image/gif		gif;
		image/x-icon	ico;
		application/pdf	pdf;
		application/json	json;
	}
	default_type	text/plain;			# used for extensions not in the map

	# --- Directory handling default -----------------------------------------
	index	index.html;					# cleared by `autoindex true` per-location

	# --- Error pages inherited by every server ------------------------------
	error_page	404	/404.html;
	error_page	500 501 502 503 504	/50x.html;

	# =========================================================================
	#  CANONICAL HOST REDIRECTS — apex domain -> www subdomain.
	#
	#  In nginx this is a bare `return` in the server context:
	#
	#      server {
	#          listen 80;
	#          server_name pizzasuicideclub.com;
	#          return 301 http://www.pizzasuicideclub.com$request_uri;
	#      }
	#
	#  This parser accepts `return` only in a LOCATION, and it has no variables,
	#  so the idiom becomes a redirect-only server whose catch-all `location /`
	#  returns an absolute URL.  Two consequences worth knowing during a demo:
	#
	#    * the request path is DROPPED — every apex URL lands on the www front
	#      page, where nginx would have preserved it via $request_uri;
	#    * the target is an absolute URL, which is what makes this work at all:
	#      `return` with a bare path is an INTERNAL redirect, and those loop
	#      until REDIRECT_LIMIT and answer 500 (see /old and /gone below).
	#
	#  Serving on :80 is what lets the redirect targets stay portless, the way
	#  a real deployment writes them.  On a TLS host these servers would also
	#  carry `listen 443 ssl;` and redirect to https:// instead.
	# =========================================================================
	server {
		listen		127.0.0.1:80;
		# Also answer on the second socket, so the apex name behaves the same
		# there.  Same addr:port pair as the parapara server below, so the
		# backlog value has to match there too — webserv rejects a config that
		# registers one socket with two different backlogs.
		listen		127.0.0.1:8081 backlog=64;
		server_name	pizzasuicideclub.com;

		location / {
			return 301 http://www.pizzasuicideclub.com/;
		}
	}

	server {
		listen		127.0.0.1:80;
		listen		127.0.0.1:8081 backlog=64;
		server_name	duomingo.es;

		location / {
			return 301 http://www.duomingo.es/;
		}
	}

	# =========================================================================
	#  SERVER 1 — the main demo site.  default_server for 127.0.0.1:80, so it
	#  also answers for any Host that matches no server_name at all.
	# =========================================================================
	server {
		listen		127.0.0.1:80 default_server;
		server_name	www.pizzasuicideclub.com showcase.local;	# several names accumulate

		root __WWWROOT__;

		# Server-level overrides of the inherited limits.
		client_header_timeout	20s;
		client_body_timeout		20s;
		client_max_body_size	1m;

		# NB: the FIRST error_page in a block CLEARS the inherited map, so every
		# code this server cares about has to be (re)listed together here.
		error_page	400	/400.html;
		error_page	404	/404.html;
		error_page	405	/405.html;
		error_page	408	/408.html;
		error_page	413	/413.html;
		error_page	414	/414.html;
		error_page	431	/431.html;
		error_page	500 502 503 504	/50x.html;
		# A bare `=` keeps whatever status the internal redirection produced.
		error_page	403	=	/403.html;
		# An absolute URL turns the error into an EXTERNAL redirect.  501 is
		# reachable — any unknown method produces it — so this one is testable:
		#   curl -i -X FROB http://www.pizzasuicideclub.com/  ->  302 to MDN
		error_page	501	=302	https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/501;

		# ------------------------------------------------------------------
		#  Catch-all.  Longest-prefix wins, so every location below beats it.
		# ------------------------------------------------------------------
		location / {
			root __WWWROOT__;
			# `index` (inherited from http) turns GET / into GET /index.html
		}

		# ------------------------------------------------------------------
		#  Prefix match + a NESTED location.
		#  A nested block's path is parent-path + own-path, i.e. `/static/css`,
		#  and it inherits everything the parent resolved to.
		# ------------------------------------------------------------------
		location /static {
			root __WWWROOT__;
			index index.html;

			location /css {
				root __WWWROOT__;
				# Location-scoped MIME map: replaces the inherited one for this
				# subtree only.
				types {
					text/css	css;
				}
				default_type	text/plain;
			}
		}

		# ------------------------------------------------------------------
		#  Generated directory listing.  `autoindex true` clears the inherited
		#  `index`, so the directory is listed instead of serving index.html.
		#  (The parser takes true/false — not nginx's on/off.)
		# ------------------------------------------------------------------
		location /autoindex {
			root __WWWROOT__;
			autoindex true;
		}

		# ------------------------------------------------------------------
		#  Per-location index file for a subdirectory.
		# ------------------------------------------------------------------
		location /idxdir {
			root __WWWROOT__;
			index index.html;
		}

		# ------------------------------------------------------------------
		#  A directory whose index is not an .html file (42 tester fixture).
		# ------------------------------------------------------------------
		location /YoupiBanane {
			root __WWWROOT__;
			index youpi.bad_extension;
		}

		# The 42 tester asks for /directory/ specifically.  There is no `alias`
		# directive, so `root` is prefixed to the whole URI — the fixture has to
		# live at <root>/directory/, which is why www/directory/ exists next to
		# www/YoupiBanane/ (same files; the older confs point at the latter).
		# NB: no trailing slash on the location path — normalize_req_path()
		# strips a trailing '/' from the request, so `location /directory/`
		# could never match (conf/tester-42.conf has that bug today).
		location /directory {
			root __WWWROOT__;
			index youpi.bad_extension;
		}

		# ------------------------------------------------------------------
		#  Method restriction: only GET survives here, everything else -> 405.
		# ------------------------------------------------------------------
		location /readonly {
			root __WWWROOT__;
			limit_except GET;
			autoindex true;			# browsable, but read-only
		}

		# ------------------------------------------------------------------
		#  Upload / delete playground.
		#  POST writes its body to <root><uri> and answers 201; DELETE unlinks
		#  that file and answers 204.
		# ------------------------------------------------------------------
		location /uploads {
			root __WWWROOT__;
			limit_except GET POST DELETE;
			client_body_buffer_size	16k;
			client_max_body_size	1m;		# -> 413 above 1000000 bytes
			autoindex true;					# browse what has been uploaded

			# Storage root for POST bodies: the target file is
			# <upload_directory><request-uri>, so pointing this at the document
			# root puts POST /uploads/x.txt at www/uploads/x.txt, where the
			# autoindex above can show it.  Without this line the default
			# directory is the relative path "upload" and every POST here is a
			# 500.  The second parameter is the URI prefix echoed back in the
			# 201 Location header.
			# A dedicated storage directory outside the doc root would be the
			# stricter setup, but it needs `create_path`, which is broken today
			# (see the note in the report).
			upload_directory __WWWROOT__ uploads;
		}

		# ------------------------------------------------------------------
		#  Tighter per-location body cap: anything over 100 bytes -> 413.
		#  POSTs land in www/tiny/.
		#  [BUG] the 413 answer only comes back when the body is larger than
		#  one buffer.  handle_setup enters DISCARD_BODY with
		#  `_written_body = _buf.feed_capacity()` but never tests it against
		#  content_length there, so a small body that arrived together with the
		#  headers leaves the connection waiting for bytes that already came.
		#  Demo the 413 against /uploads (1m cap) until that is fixed.
		# ------------------------------------------------------------------
		location /tiny {
			root __WWWROOT__;
			client_max_body_size 100;
			upload_directory __WWWROOT__ tiny;
		}

		# ------------------------------------------------------------------
		#  Location-scoped error_page with a status override: a miss in this
		#  subtree still serves the 404 body, but answers 200.  No directory
		#  needs to exist for this — the miss itself is what triggers it.
		# ------------------------------------------------------------------
		location /quiet {
			root __WWWROOT__;
			error_page 404 =200 /404.html;
		}

		# ------------------------------------------------------------------
		#  Redirects.
		# ------------------------------------------------------------------
		# `return` to a local path: a client-visible 301 with a Location header.
		# The target is NOT served inline -- the client re-requests /index.html.
		location /old {
			return 301 /index.html;
		}

		# External redirect (absolute URL) — this one works.  It is the same
		# mechanism the two apex-to-www servers above rely on.
		location /ext {
			return 302 https://example.com/;
		}

		# `return` with no explicit status code -> the documented 302 default.
		location /gone {
			return /index.html;
		}

		# ------------------------------------------------------------------
		#  CGI by prefix.  cgi_param adds environment variables on top of the
		#  standard RFC 3875 set.  SERVER_NAME is the Host header with its port
		#  stripped, so envdump.py shows `www.pizzasuicideclub.com` here.
		# ------------------------------------------------------------------
		location /cgi-bin {
			root __WWWROOT__;
			cgi_pass /usr/bin/python3;

			cgi_param APP_ENV		showcase;
			cgi_param SECRET_KEY	hunter2;
			# NB: a cgi_param value must lex as a bare string.  A value starting
			# with '/' lexes as a path token and is rejected, so filesystem
			# paths cannot be handed to a script this way today.

			client_max_body_size 1m;
		}

		# ------------------------------------------------------------------
		#  CGI by SUFFIX.  A leading `\` switches prefix matching off, so this
		#  block matches any URI ENDING in `.bla`, in any directory.
		# ------------------------------------------------------------------
		location \ .bla {
			root __WWWROOT__;
			cgi_pass __WWWROOT__/cgi-bin/cgi_test;
		}
	}

	# =========================================================================
	#  SERVER 2 — www.duomingo.es, a name-based virtual host sharing
	#  127.0.0.1:80 with the site above.  Selected only when the Host header is
	#  `www.duomingo.es`/`assets.duomingo.es`; anything else on this socket
	#  falls through to SERVER 1 (the default_server).
	# =========================================================================
	server {
		listen		127.0.0.1:80;
		server_name	www.duomingo.es assets.duomingo.es;

		root __WWWROOT__/static;

		index index.html;

		error_page	404	/404.html;

		location / {
			root __WWWROOT__/static;
		}

		# This vhost is read-only and browsable.
		location /css {
			root __WWWROOT__/static;
			limit_except GET;
			autoindex true;
		}

		location /img {
			root __WWWROOT__/static;
			limit_except GET;
			autoindex true;
		}
	}

	# =========================================================================
	#  SERVER 3 — a subdomain with its own document root, served on :80 like
	#  the rest AND on a second socket with its own backlog.  Demonstrates one
	#  process serving several sockets from one config.  No www-redirect here:
	#  canonicalising the apex onto `www.` is a convention for the registrable
	#  domain, not for every subdomain.
	#
	#  The 8081 backlog value must match the one the redirect servers use for
	#  127.0.0.1:8081 — see the comment on those `listen` lines.  It is the
	#  default_server for 8081; on :80 that role belongs to SERVER 1.
	# =========================================================================
	server {
		listen		127.0.0.1:80;
		listen		127.0.0.1:8081 default_server backlog=64;
		server_name	parapara.pizzasuicideclub.com parapara.local;

		root __WWWROOT__/parapara;

		# Everything not mentioned here is inherited from the http block.
		client_max_body_size 512k;

		error_page	404	/index.html;	# every miss lands back on the front page

		location / {
			root __WWWROOT__/parapara;
			limit_except GET;
		}

		location /css {
			root __WWWROOT__/parapara;
			limit_except GET;
			autoindex true;
		}
	}
}

# =============================================================================
#  GUIDED TOUR  (all commands verified against this config)
#
#  These use real hostnames on the default port, so they need the /etc/hosts
#  entries and the setcap from the top of the file.  Testing without touching
#  /etc/hosts works just as well with an explicit Host header:
#      curl -i -H 'Host: www.duomingo.es' http://127.0.0.1/
# =============================================================================
#
#  canonical host redirect (apex -> www)
#    curl -i http://pizzasuicideclub.com/
#                            301 Location: http://www.pizzasuicideclub.com/
#    curl -i http://duomingo.es/
#                            301 Location: http://www.duomingo.es/
#    curl -iL http://pizzasuicideclub.com/            follows through to the site
#    curl -i http://pizzasuicideclub.com/static/css/style.css
#                            301 to the www ROOT — the path is dropped, since
#                            there is no $request_uri to append (see above)
#
#  unknown Host falls through to the default_server (SERVER 1)
#    curl -i -H 'Host: nope.invalid' http://127.0.0.1/     main site index
#
#  static files + MIME map
#    curl -i http://www.pizzasuicideclub.com/                     200 text/html
#    curl -i http://www.pizzasuicideclub.com/static/              200 text/html
#    curl -i http://www.pizzasuicideclub.com/static/css/style.css 200 text/css
#    curl -i http://www.pizzasuicideclub.com/static/image.png     200 image/png
#    curl -i http://www.pizzasuicideclub.com/big.txt              200 text/plain
#
#  directory handling
#    curl -i http://www.pizzasuicideclub.com/autoindex/   200 generated listing
#    curl -i http://www.pizzasuicideclub.com/idxdir/      200 www/idxdir/index.html
#    curl -i http://www.pizzasuicideclub.com/YoupiBanane/ 200 youpi.bad_extension
#    curl -i http://www.pizzasuicideclub.com/directory/   200 youpi.bad_extension
#
#  errors
#    curl -i http://www.pizzasuicideclub.com/nope         404 + www/404.html
#    curl -i http://www.pizzasuicideclub.com/quiet/nope   200, but the 404 body
#    curl -i -X FROB http://www.pizzasuicideclub.com/     501 -> 302 to MDN
#    curl -i -X DELETE http://www.pizzasuicideclub.com/readonly/dontdelete
#                                                          405 + www/405.html
#
#  methods
#    curl -i -X DELETE http://www.pizzasuicideclub.com/readonly/dontdelete
#                                                          405, Allow: GET
#    curl -i -X POST --data 'hello upload' \
#         http://www.pizzasuicideclub.com/uploads/demo.txt         201 Created
#    curl -i http://www.pizzasuicideclub.com/uploads/              200 listing
#    curl -i -X DELETE http://www.pizzasuicideclub.com/uploads/demo.txt
#                                                                  204 No Content
#
#  body limit
#    head -c 1200000 /dev/zero | tr '\0' a > /tmp/big.bin
#    curl -i -X POST --data-binary @/tmp/big.bin \
#         http://www.pizzasuicideclub.com/uploads/toobig.txt       413 (1m cap)
#    ( /tiny has a 100-byte cap but [BUG] hangs on a body that fits in one
#      buffer — see the note on that location. )
#
#  header timeout (408) — open a connection and never finish the header
#    printf 'GET / HTTP/1.1\r\n' | nc 127.0.0.1 80      ... 408 after 20s
#
#  redirects
#    curl -i http://www.pizzasuicideclub.com/ext   302 Location: https://example.com/
#    curl -i http://www.pizzasuicideclub.com/old   301 Location: /index.html
#
#  CGI  (browser-friendly: http://www.pizzasuicideclub.com/forms.html)
#    curl -i 'http://www.pizzasuicideclub.com/cgi-bin/echo.py?a=1&b=2'
#    curl -i -X POST --data hello http://www.pizzasuicideclub.com/cgi-bin/echo.py
#    curl -i 'http://www.pizzasuicideclub.com/cgi-bin/greet.py?name=eval'
#    curl -i http://www.pizzasuicideclub.com/cgi-bin/envdump.py
#                            APP_ENV, SECRET_KEY, SERVER_NAME=www.pizzasuicideclub.com
#    curl -i http://www.pizzasuicideclub.com/directory/youpi.bla
#
#  virtual hosts (same socket, different Host)
#    curl -i http://www.pizzasuicideclub.com/       main site
#    curl -i http://www.duomingo.es/                www/static/index.html
#    curl -i http://www.duomingo.es/css/            listing
#    curl -i http://assets.duomingo.es/img/         listing (second name, same vhost)
#    curl -i http://parapara.pizzasuicideclub.com/  www/parapara/index.html
#
#  second socket (no domain needed — the showcase's multi-socket demo)
#    curl -i http://127.0.0.1:8081/                 www/parapara/index.html
#    curl -i http://127.0.0.1:8081/css/             listing
#    curl -i -H 'Host: pizzasuicideclub.com' http://127.0.0.1:8081/
#                            301 Location: http://www.pizzasuicideclub.com/
# =============================================================================
